<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#186078" />
    <title>Wiki 查询助手</title>
    <link rel="icon" type="image/png" href="/icon/gdutnic.png" />
    <link rel="apple-touch-icon" href="/icon/gdutnic.png" />
    <link rel="stylesheet" href="/static/styles.css?v=20260902v" />
  </head>
  <body class="gate-body">
    <section id="wikiGate" class="wiki-gate">
      <div class="mark"><img src="/icon/gdutnic.png" alt="" /></div>
      <h1>欢迎使用网协Wiki助手</h1>
      <p class="hint" id="gateStatus"></p>
      <button type="button" id="btnOauth" class="animated-button">
        <span class="arr-2 oauth-icon md-icon" style="--md-icon:url('/icon/symbol/arrow_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg')" aria-hidden="true"></span>
        <span class="oauth-x oauth-icon md-icon" style="--md-icon:url('/icon/symbol/close_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg')" aria-hidden="true"></span>
        <span class="text">网协认证登陆</span>
        <span class="circle"></span>
        <span class="error-wash" aria-hidden="true"></span>
        <span class="arr-1 oauth-icon md-icon" style="--md-icon:url('/icon/symbol/arrow_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg')" aria-hidden="true"></span>
      </button>
    </section>

    <div id="app" class="app field-hidden" hidden>
      <aside class="panel">
        <header class="brand">
          <div class="mark"><img src="/icon/gdutnic.png" alt="" /></div>
          <div>
            <h1>GDUTNIC Wiki 查询助手</h1>
            <p class="brand-sub">Wiki 查询助手<span class="ver-chip" title="当前为早期测试版，不代表最终表现">v0.7</span></p>
          </div>
        </header>

        <section class="history">
          <h2>历史会话</h2>
          <div id="historyList" class="history-list"></div>
        </section>
        <div class="panel-footer">
          <button type="button" id="btnLogout" class="btn danger send" aria-label="登出" title="登出">
            <span class="md-icon" style="--md-icon:url('/icon/symbol/logout_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg')" aria-hidden="true"></span>
          </button>
          <button type="button" id="btnNewSession" class="btn primary send" aria-label="新建会话" title="新建会话">
            <span class="md-icon" style="--md-icon:url('/icon/symbol/new_window_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg')" aria-hidden="true"></span>
          </button>
        </div>
      </aside>

      <button type="button" id="drawerScrim" class="drawer-scrim" hidden aria-label="关闭会话列表"></button>
      <main class="chat">
        <header class="chat-bar" id="chatBar">
          <button type="button" id="btnMenu" class="btn ghost send mobile-only" aria-label="打开会话列表" aria-expanded="false">
            <span class="menu-bars" aria-hidden="true"></span>
          </button>
          <div class="chat-bar-title">
            <strong id="chatTitle">新会话</strong>
          </div>
        </header>
        <div id="thread" class="thread"></div>
      </main>
      <div class="composer-dock" id="composerDock">
        <div class="composer-blur" aria-hidden="true"></div>
        <form id="composer" class="composer">
          <div id="imagePreviews" class="image-previews" hidden></div>
          <div class="composer-row">
            <button type="button" id="btnAttach" class="btn ghost send" aria-label="上传图片" title="上传图片">
              <span class="md-icon" style="--md-icon:url('/icon/symbol/image_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg')" aria-hidden="true"></span>
            </button>
            <input id="imageInput" type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple hidden />
            <textarea id="input" rows="1" placeholder="向知识库提问…"></textarea>
            <button type="submit" id="btnSend" class="btn primary send" aria-label="发送">
              <span class="md-icon" style="--md-icon:url('/icon/symbol/send_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg')" aria-hidden="true"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
    <p id="appToast" class="app-toast" hidden role="status"></p>
    <script src="/static/markdown.js?v=20260903a"></script>
    <script src="/static/app.js?v=20260903e"></script>
  </body>
</html>
